defaults:
  - _self_
  - dataset: lingo
  - guidance:
      - pelvis
  - model:
      - model_smplx
      - synhsi_body
  - sampler:
      - pelvis

train: false
# test/scene loads dataset/Scene; visualization/scene_vis loads dataset/Scene_vis.
scene_mode: test
device: cuda
batch_size: 1
interp_s: 3

locomotion_threshold: 1.0

vis: true
start_type: stand

repeat_time: 0
seg_num: 1
seg_len: 4 # episode

speed: 0.8

#visualization sampling
test_setting: demo-21
exp_dir: ${oc.env:ROOT_DIR}/results/outputs
ckpt_path: ${oc.env:ROOT_DIR}/results/train5.28/checkpoints/best_model.pth
input_path: ${oc.env:ROOT_DIR}/results/inputs/scene21/action0.pkl
smpl_dir: ${oc.env:ROOT_DIR}/smpl_models

# Multi-modality evaluation sampling.
# When enabled, sample_lingo.py reads all pkl files from mm_input_dir and
# generates mm_num_repeats stochastic samples for each input.
mm_sampling: True
mm_input_dir: ${oc.env:ROOT_DIR}/results/inputs_test
mm_input_glob: "*.pkl"
mm_output_dir: ${exp_dir}/outputs_test
mm_num_repeats: 10
mm_max_inputs: 0
mm_skip_existing: true

scene_type: occ_two

max_window_size: 120

motion_len: 10000000

load_language: true
load_scene: true
use_pi: true
load_hand_goal: true
load_pelvis_goal: true
load_object: false

auto_regre_num: 2 # prefixed frames for each segment

num_gpus: 1
num_workers: 0

hydra:
  run:
    dir: ${exp_dir}
