defaults:
  - _self_
  - dataset: lingo
  - guidance:
      - pelvis
  - model:
      - model_smplx
      - synhsi_body
  - sampler:
      - pelvis
  # ONE SWITCH: vis (Blender demo) | test (batch evaluation)
  # Edit the line below, or override from CLI:
  #   python sample.py sampling_mode=test
  - sampling_mode: test

train: false
device: cuda
batch_size: 1
interp_s: 3

locomotion_threshold: 1.0
use_completion_stop: true
completion_threshold: 0.7
completion_min_step: 2
completion_patience: 1

start_type: stand

repeat_time: 0
seg_num: 1
seg_len: 4 # episode

speed: 0.8

exp_dir: ${oc.env:ROOT_DIR}/results/
ckpt_path: ${oc.env:ROOT_DIR}/results/train_fm6.25/checkpoints/best_model.pth
smpl_dir: ${oc.env:ROOT_DIR}/smpl_models

scene_type: occ_two

max_window_size: 16

motion_len: 10000000

load_language: true
load_scene: true
use_pi: true
load_hand_goal: true
load_pelvis_goal: true
load_object: false

auto_regre_num: 2 # prefixed frames for each segment
# Must match the training checkpoint. Override use_motion_state=false for old checkpoints.
use_motion_state: true
motion_state_len: 4

use_aux_losses: false
completion_pos_weight: 32.0
aux_loss_weights:
  pelvis_traj: 0
  completion: 0.2

num_gpus: 1
num_workers: 0

hydra:
  run:
    dir: ${exp_dir}
