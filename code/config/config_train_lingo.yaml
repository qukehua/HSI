defaults:
  - dataset: lingo
  - guidance:
      - pelvis
  - model:
      - synhsi_body
  - sampler:
      - pelvis
  - _self_

exp_name: train_fm6.25
train: true
scene_mode: auto
load_state_dict: false
batch_size: 512
lr: 0.0001
use_lr_decay: true
lr_scheduler: warmup_cosine
lr_warmup_steps: 5000
lr_min: 0.00001
lr_decay_gamma: 0.95
lr_decay_step_size: 50
epochs: 500
device: cuda:0
ckpt_name: None
use_tensorboard: true
use_wandb: true
wandb_project: HSI
wandb_entity: null
wandb_run_name: ${exp_name}
wandb_mode: online
log_interval: 10
ckpt_interval: 50
use_validation: true
val_split: val
val_interval: 1
val_batch_size: ${batch_size}

exp_dir: ${oc.env:ROOT_DIR}/results/${exp_name}
smpl_dir: ${oc.env:ROOT_DIR}/smpl_models

num_gpus: 7
num_workers: 0
scene_type: occ_two
max_window_size: 16
motion_len: 100000
vis: false
start_type: stand

load_language: true
load_scene: true
use_pi: true
load_hand_goal: true
load_pelvis_goal: true
load_object: false
auto_regre_num: 2
use_motion_state: true
motion_state_len: 4
use_human_object_cross_query: true
human_object_query_num_points: 64
human_object_query_joint_ids: null
human_object_collision_margin: 0.05
human_object_collision_num_points: 128
human_object_collision_joint_ids: null

# Auxiliary loss switches and weights (passed to sampler.pelvis).
use_aux_losses: true
completion_pos_weight: 32.0
aux_loss_weights:
  pelvis_traj: 0.5
  completion: 0.2
  human_object_collision: 0

dataset:
  split: train

ckpt_path: None

hydra:
  run:
    dir: ${exp_dir}
