synhsi_body:
  _target_: models.synhsi.Unet
  dim_model: 512
  num_heads: 16
  num_layers: 8
  dropout_p: 0.1
  nb_voxels: ${dataset.nb_voxels}
  free_p: 0.1
  architecture: global_to_local
  ac_type: last_add_first_token
  dim_input: ${times:${dataset.nb_joints},3}
  dim_output: ${times:${dataset.nb_joints},3}
  scene_type: ${scene_type}
  load_scene: ${load_scene}
  load_language: ${load_language}
  load_hand_goal: ${load_hand_goal}
  load_pelvis_goal: ${load_pelvis_goal}
  load_object: ${load_object}
  use_motion_state: ${use_motion_state}
  motion_state_len: ${motion_state_len}
  use_human_object_cross_query: ${use_human_object_cross_query}
  human_object_query_num_points: ${human_object_query_num_points}
  human_object_query_margin: ${human_object_collision_margin}
  human_object_query_joint_ids: ${human_object_query_joint_ids}
  object_motion_dim: 9
  trajectory_anchor_stride: 4
  num_scene_query_frames: 8
  scene_query_coord_scale: 1.0
  phase_dim: 32
  contact_dim: 6
  language_feature_dim: ${dataset.language_feature_dim}
  ckpt: ${ckpt_path}
