# Evaluation config for code/evaluation.py.
# CLI arguments override these values, for example:
# python evaluation.py --config config/config_evaluation.yaml --metrics locomotion

# Files, directories, or globs produced by sample.py or your own sampler.
# Required. Fill this before running without --generated.
generated: [/share/qkh/humoworld/results/outputs_test/**/*.pkl]
# Randomly sample 100 idx; each idx keeps all repeats (30) for 3000 total samples.
generated_max_idx: 100
generated_sample_seed: 42

# GT/reference motions or features for FID, Precision, Recall, and F1.
# Leave empty when you only need diversity, locomotion, or reaching metrics.
reference: []

# Optional: automatically slice GT clips from the LINGO window dataset as reference.
# This reads human_joints_aligned.npy with mmap and cuts clips using
# language_motion_dict start_idx/end_idx.
reference_dataset: /share/qkh/dataset/lingo

reference_motion_dict: language_motion_dict/language_motion_dict__inter_and_loco__16.pkl
reference_joints_file: human_joints_aligned.npy
# Optional joint ids for raw GT reference clips. Set this when reference_joints_file
# contains more joints than the generated/evaluator joint set.
reference_joints_ind: null
reference_split: test
reference_split_dataset: null
reference_split_dir: splits
reference_split_source_index: null
reference_max_samples: 200
reference_sample_seed: null
reference_step: 3
reference_window_size: 16

# Optional GT filters. Keep null to use all clips. Set true/false to select.
reference_text_contains: null
reference_need_scene: null
reference_need_pelvis_dir: null
reference_need_hand_goal: null
reference_need_pi: null

# all, interactive, paired, locomotion, or reaching.
metrics: all

# Optional JSON result file.
output: null

# General motion/evaluation settings.
fps: 20.0
seed: 42

# Interactive metrics.
# If inputs already contain features/embeddings, those are used directly.
# Otherwise set motion_evaluator_checkpoint to a trained evaluator checkpoint.
feature_frames: 64
feature_dim: 512
diversity_pairs: 300
multimodality_pairs: 10
precision_k: 10

# Interactive metrics require a trained motion evaluator checkpoint.
# Train with train_motion_evaluator.py, then set motion_evaluator_checkpoint below.
motion_evaluator_checkpoint: /share/qkh/humoworld/results/motion_evaluator_lingo/checkpoints/best_model.pth
motion_evaluator_batch_size: 256
motion_evaluator_device: null
# Keep true for contrastive/CLIP-style evaluators. Raw pre-normalized features
# have unconstrained norms and can make FID explode.
motion_evaluator_normalize_embeddings: true
motion_evaluator_joints_ind: null

# MPJPE requires generated samples and GT references to share an id such as
# idx-123 in mm_group_id/test_setting/input_pkl_path.
mpjpe_frame_alignment: resample
# Trajectory metrics use p_t from this joint id and compare generated vs GT.
# Goal error is last-frame distance; Traj. error is mean frame distance;
# Traj. similarity is the fraction of frames below trajectory_threshold.
trajectory_joint: 0
trajectory_threshold: 0.5

# Scene penetration metrics.
# Use dataset/Scene_vis with the default eval grid, or dataset/Scene with:
# scene_grid: [-3, 0, -4, 3, 2, 4, 300, 100, 400]
scene_occ: /share/qkh/dataset/lingo/Scene
scene_grid: [-3, 0, -4, 3, 2, 4, 300, 100, 400]
body_points: auto
out_of_bounds_occupied: true

# Foot sliding metrics.
foot_joints: [7, 8, 10, 11]
floor_height: null
contact_height: 0.05
contact_velocity: 0.10

# Human-object contact metrics. These replace the old reach_error_dist,
# reach_final_error_dist, and time_used fields in the reaching metric group.
# Defaults follow OMOMO joints24: hands are joints 22 and 23, threshold is 5cm.
goal: null
goal_file: null
hand_joints: [20, 21, 25, 26, 27, 40, 49]
reach_threshold: 0.20
contact_hand_joints: null
contact_threshold: 0.05
object_mesh_dir: null

# SMPL-X conversion settings for sample.py output pkl files.
# Required when generated files contain transl/body_pose/global_orient.
smpl_dir: /share/qkh/humoworld/smpl_models
gender: male
device: cuda
smpl_batch_size: 256
compute_vertices: false
joints_ind: null
